
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini E-Commerce Store</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f6fa;
    color: #222;
}

header {
    background: #172554;
    color: white;
    padding: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

header h1 {
    font-size: 25px;
}

.cart-btn {
    background: #f59e0b;
    color: #172554;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 30px 18px;
}

.intro {
    text-align: center;
    margin-bottom: 30px;
}

.intro h2 {
    margin-bottom: 10px;
}

.products {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
}

.product {
    background: white;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,.07);
    transition: .3s;
}

.product:hover {
    transform: translateY(-7px);
    box-shadow: 0 12px 25px rgba(0,0,0,.13);
}

.product img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    background: #eee;
}

.product-info {
    padding: 18px;
}

.product-info h3 {
    margin-bottom: 8px;
}

.product-info p {
    color: #666;
    font-size: 14px;
    margin-bottom: 12px;
}

.price {
    color: #2563eb;
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
}

.add-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.add-btn:hover {
    background: #1d4ed8;
}

.cart-section {
    display: none;
    background: white;
    padding: 22px;
    margin-top: 30px;
    border-radius: 14px;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 15px 0;
    border-bottom: 1px solid #eee;
}

.cart-item p {
    font-size: 14px;
}

.quantity button,
.remove-btn {
    padding: 6px 10px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.quantity button {
    background: #dbeafe;
}

.remove-btn {
    background: #fee2e2;
    color: #b91c1c;
}

.total {
    text-align: right;
    margin-top: 20px;
    font-size: 22px;
    font-weight: bold;
}

.checkout-btn {
    display: block;
    margin: 18px 0 0 auto;
    padding: 13px 25px;
    background: #16a34a;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    justify-content: center;
    align-items: center;
    padding: 15px;
    z-index: 10;
}

.modal-content {
    background: white;
    color: #222;
    width: 100%;
    max-width: 420px;
    padding: 25px;
    border-radius: 15px;
    max-height: 85vh;
    overflow-y: auto;
}

.modal-content h2 {
    margin-bottom: 18px;
}

.modal-content p {
    margin: 12px 0;
}

.close-btn {
    background: #64748b;
    color: white;
    padding: 10px 18px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    margin-top: 12px;
}

.confirm-btn {
    background: #16a34a;
    color: white;
    padding: 10px 18px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    margin-top: 12px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #777;
}

@media(max-width: 750px) {
    .products {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 480px) {
    .products {
        grid-template-columns: 1fr;
    }

    .cart-item {
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<header>
    <h1>🛍️ MiniShop</h1>
    <button class="cart-btn" onclick="toggleCart()">
        🛒 Cart (<span id="cartCount">0</span>)
    </button>
</header>

<div class="container">

    <div class="intro">
        <h2>Explore Our Products</h2>
        <p>Find your favourite products at great prices!</p>
    </div>

    <div class="products" id="productList"></div>

    <section class="cart-section" id="cartSection">
        <h2>🛒 Shopping Cart</h2>
        <div id="cartItems"></div>

        <div class="total">
            Total: ₹<span id="totalPrice">0</span>
        </div>

        <button class="checkout-btn" onclick="checkout()">
            Proceed to Checkout
        </button>
    </section>

</div>

<div class="modal" id="checkoutModal">
    <div class="modal-content">
        <h2>🧾 Order Preview</h2>
        <div id="orderDetails"></div>
        <hr>
        <p><strong>Total: ₹<span id="orderTotal">0</span></strong></p>
        <p style="color:#777;font-size:12px">
            Demo checkout only. No real payment will be processed.
        </p>
        <button class="confirm-btn" onclick="placeOrder()">
            Confirm Demo Order
        </button>
        <button class="close-btn" onclick="closeModal()">
            Close
        </button>
    </div>
</div>

<footer>
    MiniShop | Built with HTML, CSS and JavaScript
</footer>

<script>

// Product data
const products = [
    {
        id: 1,
        name: "Wireless Headphones",
        price: 1499,
        description: "Premium sound quality",
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
    },
    {
        id: 2,
        name: "Smart Watch",
        price: 1999,
        description: "Track your daily activities",
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
    },
    {
        id: 3,
        name: "Running Shoes",
        price: 2499,
        description: "Comfortable everyday shoes",
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
    },
    {
        id: 4,
        name: "Backpack",
        price: 999,
        description: "Stylish travel backpack",
        image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500"
    },
    {
        id: 5,
        name: "Sunglasses",
        price: 799,
        description: "Modern stylish sunglasses",
        image: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500"
    },
    {
        id: 6,
        name: "Camera",
        price: 4999,
        description: "Capture beautiful moments",
        image: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=500"
    }
];

// Shopping cart
let cart = [];

// Display products dynamically
function displayProducts() {

    const productList =
        document.getElementById("productList");

    productList.innerHTML = "";

    products.forEach(product => {

        const card = document.createElement("div");
        card.className = "product";

        card.innerHTML = `
            <img src="${product.image}"
                 alt="${product.name}"
                 loading="lazy">
            <div class="product-info">
                <h3>${product.name}</h3>
                <p>${product.description}</p>
                <div class="price">₹${product.price}</div>
                <button class="add-btn"
                    onclick="addToCart(${product.id})">
                    Add to Cart
                </button>
            </div>
        `;

        productList.appendChild(card);
    });
}

// Add product to cart
function addToCart(id) {

    const product = products.find(p => p.id === id);

    const existing = cart.find(item => item.id === id);

    if (existing) {
        existing.quantity++;
    } else {
        cart.push({...product, quantity: 1});
    }

    updateCart();
}

// Increase or decrease quantity
function changeQuantity(id, amount) {

    const item = cart.find(p => p.id === id);

    if (!item) return;

    item.quantity += amount;

    if (item.quantity <= 0) {
        cart = cart.filter(p => p.id !== id);
    }

    updateCart();
}

// Remove product
function removeItem(id) {
    cart = cart.filter(p => p.id !== id);
    updateCart();
}

// Update cart details
function updateCart() {

    const cartItems =
        document.getElementById("cartItems");

    cartItems.innerHTML = "";

    let total = 0;
    let count = 0;

    cart.forEach(item => {

        total += item.price * item.quantity;
        count += item.quantity;

        const div = document.createElement("div");
        div.className = "cart-item";

        div.innerHTML = `
            <div>
                <strong>${item.name}</strong>
                <p>₹${item.price} × ${item.quantity}</p>
            </div>

            <div class="quantity">
                <button onclick="changeQuantity(${item.id}, -1)">−</button>
                ${item.quantity}
                <button onclick="changeQuantity(${item.id}, 1)">+</button>
            </div>

            <button class="remove-btn"
                onclick="removeItem(${item.id})">
                Remove
            </button>
        `;

        cartItems.appendChild(div);
    });

    document.getElementById("cartCount").textContent =
        count;

    document.getElementById("totalPrice").textContent =
        total.toLocaleString("en-IN");

    if (cart.length === 0) {
        cartItems.textContent = "Your cart is empty.";
    }
}

// Show or hide cart
function toggleCart() {

    const section =
        document.getElementById("cartSection");

    section.style.display =
        section.style.display === "block"
        ? "none" : "block";

    section.scrollIntoView({behavior: "smooth"});
}

// Checkout preview
function checkout() {

    if (cart.length === 0) {
        alert("Please add products to your cart!");
        return;
    }

    const orderDetails =
        document.getElementById("orderDetails");

    orderDetails.innerHTML = "";

    cart.forEach(item => {

        const p = document.createElement("p");

        p.textContent =
            item.name + " × " + item.quantity +
            " = ₹" +
            (item.price * item.quantity).toLocaleString("en-IN");

        orderDetails.appendChild(p);
    });

    const total = cart.reduce(
        (sum, item) =>
        sum + item.price * item.quantity, 0
    );

    document.getElementById("orderTotal").textContent =
        total.toLocaleString("en-IN");

    document.getElementById("checkoutModal").style.display =
        "flex";
}

function closeModal() {
    document.getElementById("checkoutModal").style.display =
        "none";
}

// Demo order confirmation
function placeOrder() {

    if (cart.length === 0) return;

    alert("Your demo order has been placed successfully!");

    cart = [];

    updateCart();
    closeModal();

    document.getElementById("cartSection").style.display =
        "none";
}

// Start application
displayProducts();
updateCart();

</script>

</body>
</html>
